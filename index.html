<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒體畫布編輯器V2 - 雛型 (手繪風)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .canvas-bg {
            background-color: #fbfbfb;
            background-image: linear-gradient(to right, #e5e7eb 1px, transparent 1px), linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Handdrawn CSS from Ian's Skill */
        .sketch {
            border: 2px solid #334155;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background-color: white;
            transition: all 0.2s ease;
        }
        .sketch:hover {
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
        }
        .sketch-panel {
            border: 2px solid #334155;
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            background-color: transparent;
        }
        .sketch-btn {
            border: 1.5px solid #334155;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 2px 2px 0px rgba(51, 65, 85, 0.15);
            background-color: white;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .sketch-btn:hover {
            box-shadow: 3px 3px 0px rgba(51, 65, 85, 0.25);
            transform: translateY(-1px);
        }
        .sketch-btn-disabled {
            border: 1.5px solid #94a3b8;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background-color: #f8fafc;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .sketch-header-group {
            border: 1.5px solid #334155;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            padding: 2px;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <!-- QR Code 生成函式庫 (支援進階樣式) -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100 selection:text-indigo-900 flex flex-col">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden fixed inset-0 z-[9998] bg-slate-900/50 backdrop-blur-sm flex flex-col justify-center items-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl flex flex-col items-center">
            <i class="fas fa-spinner fa-spin text-3xl text-indigo-600 mb-4"></i>
            <p id="loading-message" class="text-slate-700 font-bold">處理中...</p>
        </div>
    </div>

    <!-- Header -->
    <header class="relative z-40 h-14 bg-white border-b-2 border-slate-700 flex items-center justify-between px-2 sm:px-3 shrink-0 select-none gap-2 overflow-x-auto no-scrollbar whitespace-nowrap">
        <!-- Left: Home, Title & Status -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 whitespace-nowrap">
            <button id="btn-back-to-dashboard" class="sketch-btn px-2 sm:px-2.5 py-1 text-xs font-bold text-slate-700 hover:bg-slate-50 flex items-center shadow-[1.5px_1.5px_0px_#334155] shrink-0 whitespace-nowrap" title="儲存並返回專案管理儀表板">
                <i class="fas fa-home sm:mr-1.5 text-indigo-600"></i> <span class="hidden sm:inline">首頁</span>
            </button>

            <div class="h-4 sm:h-5 w-[1px] bg-slate-300 mx-0.5 shrink-0"></div>

            <div class="flex items-center gap-1 sm:gap-1.5 shrink-0 whitespace-nowrap">
                <div class="sketch flex items-center justify-center w-6 h-6 font-bold text-xs text-slate-700 shadow-[1px_1px_0px_#cbd5e1] shrink-0">
                    <i class="fas fa-cubes"></i>
                </div>
                <div class="relative group flex items-center shrink-0">
                    <span id="current-project-title-display" class="font-bold text-xs text-slate-800 hover:text-indigo-600 cursor-pointer truncate max-w-[90px] sm:max-w-[150px] md:max-w-[220px] px-1 py-0.5 rounded border border-transparent hover:border-indigo-300 transition whitespace-nowrap" title="點擊編輯專案名稱">
                        未命名專案
                    </span>
                    <i class="fas fa-pencil-alt text-[10px] text-slate-400 ml-1 opacity-0 group-hover:opacity-100 transition shrink-0 hidden sm:inline"></i>
                    <input type="text" id="current-project-title-input" class="hidden bg-white border border-indigo-500 rounded px-1.5 py-0.5 text-xs font-bold text-slate-800 focus:outline-none w-28 sm:w-36 shadow-sm">
                </div>
            </div>

            <span id="auto-save-indicator" class="text-[10px] text-emerald-600 bg-emerald-50 px-1.5 sm:px-2 py-0.5 rounded-full border border-emerald-200 inline-flex items-center shrink-0 whitespace-nowrap" title="已自動儲存本機">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>
                <span class="hidden md:inline ml-1 font-medium whitespace-nowrap">已自動儲存</span>
            </span>
        </div>

        <!-- Center: Workspaces & Ratios -->
        <div class="flex items-center gap-1 sm:gap-2 shrink-0 whitespace-nowrap">
            <!-- Workspace Mode Switcher -->
            <div class="sketch-header-group flex whitespace-nowrap">
                <button id="tab-image-workspace" class="px-2 sm:px-2.5 py-1 text-xs font-bold hover:bg-slate-100 text-slate-600 border-r-2 border-slate-700/20 flex items-center whitespace-nowrap">
                    <i class="fas fa-image sm:mr-1 text-[11px]"></i> <span class="hidden sm:inline">圖片</span>
                </button>
                <button id="tab-pdf-workspace" class="px-2 sm:px-2.5 py-1 text-xs font-bold bg-indigo-50 text-indigo-700 flex items-center whitespace-nowrap">
                    <i class="fas fa-file-powerpoint sm:mr-1 text-[11px]"></i> <span class="hidden sm:inline">簡報/PDF</span><span class="sm:hidden">簡報</span>
                </button>
            </div>

            <!-- Ratio Buttons -->
            <div id="group-ratio-image" class="sketch-header-group bg-indigo-50 whitespace-nowrap">
                <button id="btn-ratio-16-9" class="px-1.5 sm:px-2 py-1 text-xs font-bold rounded hover:bg-slate-100 text-indigo-700 border-r-2 border-slate-700/20 active-ratio">16:9</button>
                <button id="btn-ratio-4-3" class="px-1.5 sm:px-2 py-1 text-xs font-bold rounded hover:bg-slate-100 text-slate-500">4:3</button>
            </div>
            <div id="group-ratio-pdf" class="sketch-header-group bg-slate-50 whitespace-nowrap" style="display: none;">
                <button id="btn-ratio-landscape" class="px-1.5 sm:px-2 py-1 text-xs font-bold rounded hover:bg-slate-100 text-slate-500 border-r-2 border-slate-700/20">橫式</button>
                <button id="btn-ratio-portrait" class="px-1.5 sm:px-2 py-1 text-xs font-bold rounded hover:bg-slate-100 text-indigo-700 active-ratio">直式</button>
            </div>
        </div>

        <!-- Right: Undo/Redo, Manual, Import, Export, Version, User Profile -->
        <div id="editor-header-right" class="flex items-center gap-1 sm:gap-1.5 shrink-0 whitespace-nowrap">
            <div class="flex items-center gap-0.5 text-slate-500 mr-0.5 shrink-0">
                <button id="btn-undo" class="w-6 h-6 sm:w-7 sm:h-7 rounded hover:bg-slate-100 hover:text-slate-700 flex items-center justify-center transition text-xs" title="復原 (Ctrl+Z)"><i class="fas fa-undo"></i></button>
                <button id="btn-redo" class="w-6 h-6 sm:w-7 sm:h-7 rounded hover:bg-slate-100 hover:text-slate-700 flex items-center justify-center transition text-xs" title="重做 (Ctrl+Y)"><i class="fas fa-redo"></i></button>
            </div>

            <button id="btn-manual" class="sketch-btn px-2 sm:px-2.5 py-1 text-xs font-bold flex items-center gap-1 bg-blue-50 text-blue-700 border-blue-800 shadow-[1px_1px_0px_#334155] shrink-0 whitespace-nowrap" title="系統說明書">
                <i class="fas fa-book text-[11px]"></i> <span class="hidden md:inline">說明書</span>
            </button>
            
            <button id="btn-import-project" class="sketch-btn px-2 sm:px-2.5 py-1 text-xs font-bold flex items-center gap-1 bg-emerald-50 text-emerald-700 border-emerald-800 shadow-[1px_1px_0px_#334155] shrink-0 whitespace-nowrap" title="匯入圖檔或專案">
                <i class="fas fa-file-import text-[11px]"></i> <span class="hidden md:inline">匯入</span>
            </button>
            <input type="file" id="input-import-project" accept="image/*" class="hidden">

            <div class="relative shrink-0">
                <button id="btn-export-dropdown" class="sketch-btn px-2 sm:px-2.5 py-1 text-xs font-bold flex items-center gap-1 bg-purple-50 text-purple-700 border-purple-800 shadow-[1px_1px_0px_#334155] whitespace-nowrap">
                    <i class="fas fa-download text-[11px]"></i> <span class="hidden md:inline">匯出</span><i class="fas fa-chevron-down text-[9px] opacity-70"></i>
                </button>
                <div id="export-options" class="hidden absolute top-full right-0 mt-1 w-44 bg-white border border-slate-200 rounded-lg shadow-xl z-50 overflow-hidden">
                    <button class="w-full px-3 py-1.5 text-xs text-left hover:bg-slate-50 font-bold text-slate-700 flex items-center gap-2" data-export-type="json">
                        <i class="fas fa-file-code text-indigo-500 w-4 text-center"></i> 匯出 JSON 專案
                    </button>
                    <button class="w-full px-3 py-1.5 text-xs text-left hover:bg-slate-50 font-bold text-slate-700 flex items-center gap-2 border-t border-slate-100" data-export-type="image">
                        <i class="fas fa-image text-emerald-500 w-4 text-center"></i> 匯出 PNG 圖片
                    </button>
                    <button class="w-full px-3 py-1.5 text-xs text-left hover:bg-slate-50 font-bold text-slate-700 flex items-center gap-2 border-t border-slate-100" data-export-type="pdf">
                        <i class="fas fa-file-pdf text-rose-500 w-4 text-center"></i> 匯出 PDF 文件
                    </button>
                    <button class="w-full px-3 py-1.5 text-xs text-left hover:bg-slate-50 font-bold text-slate-700 flex items-center gap-2 border-t border-slate-100" data-export-type="ppt">
                        <i class="fas fa-file-powerpoint text-orange-500 w-4 text-center"></i> 匯出 PPTX 簡報
                    </button>
                </div>
            </div>

            <span id="app-version-badge" class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-mono hidden shrink-0 whitespace-nowrap"></span>

            <!-- 使用者頭像與選單 (最右側) -->
            <div id="editor-user-profile-widget" class="relative ml-0.5 shrink-0"></div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Left Sidebar -->
        <aside id="left-sidebar-container" class="sidebar-collapsible relative w-[280px] sm:w-[300px] lg:w-[320px] bg-white border-r-2 border-slate-700 flex flex-col z-20 shrink-0 select-none">
            <!-- Left Sidebar Floating Toggle Button -->
            <button id="btn-toggle-left-sidebar" class="absolute -right-3.5 top-1/2 -translate-y-1/2 z-40 w-7 h-9 bg-white border-2 border-slate-700 rounded-r-md shadow-[2px_2px_0px_#334155] flex items-center justify-center text-slate-700 hover:bg-slate-100 hover:text-indigo-600 transition cursor-pointer" title="收合/展開左側面板">
                <i id="icon-toggle-left-sidebar" class="fas fa-chevron-left text-[11px] pointer-events-none transition-transform duration-200"></i>
            </button>
            <div id="left-sidebar-inner" class="flex flex-col flex-1 w-full h-full min-w-[280px] overflow-hidden">
            <!-- Tabs -->
            <div class="grid grid-cols-4 border-b-2 border-slate-700 bg-slate-50" id="sidebar-tabs">
                <button id="tab-tools" data-target="panel-tools" class="tab-btn flex flex-col items-center justify-center py-3 text-slate-800 border-b-4 border-indigo-500 bg-white font-bold transition">
                    <i class="fas fa-tools mb-1 text-lg pointer-events-none"></i>
                    <span class="text-[10px] pointer-events-none">工具</span>
                </button>
                <button id="tab-properties" data-target="panel-properties" class="tab-btn flex flex-col items-center justify-center py-3 text-slate-400 hover:text-slate-600 border-b-4 border-transparent font-bold transition">
                    <i class="fas fa-sliders-h mb-1 text-lg pointer-events-none"></i>
                    <span class="text-[10px] pointer-events-none">屬性</span>
                </button>
                <button id="tab-assets" data-target="panel-assets" class="tab-btn flex flex-col items-center justify-center py-3 text-slate-400 hover:text-slate-600 border-b-4 border-transparent font-bold transition">
                    <i class="fas fa-photo-video mb-1 text-lg pointer-events-none"></i>
                    <span class="text-[10px] pointer-events-none">素材庫</span>
                </button>
                <button id="tab-layers" data-target="panel-layers" class="tab-btn flex flex-col items-center justify-center py-3 text-slate-400 hover:text-slate-600 border-b-4 border-transparent font-bold transition">
                    <i class="fas fa-layer-group mb-1 text-lg pointer-events-none"></i>
                    <span class="text-[10px] pointer-events-none">圖層</span>
                </button>
            </div>

            <!-- Tool Content -->
            <div id="panel-tools" class="sidebar-panel flex-1 overflow-y-auto p-4 space-y-6">
                
                <!-- 基本視圖 -->
                <div class="sketch-panel p-2 mt-2">
                    <div class="grid grid-cols-6 gap-1">
                        <button id="btn-tool-select" class="p-2 sketch-btn bg-indigo-50 text-indigo-700 flex justify-center items-center" title="選取"><i class="fas fa-mouse-pointer"></i></button>
                        <button id="btn-tool-pan" class="p-2 rounded text-slate-500 hover:bg-slate-100 flex justify-center items-center" title="平移"><i class="fas fa-hand-paper"></i></button>
                        <button id="btn-tool-shape" class="p-2 rounded text-slate-500 hover:bg-slate-100 flex justify-center items-center" title="形狀"><i class="fas fa-shapes"></i></button>
                        <button id="btn-tool-brush" class="p-2 rounded text-slate-500 hover:bg-slate-100 flex justify-center items-center" title="畫筆"><i class="fas fa-paint-brush"></i></button>
                        <button id="btn-tool-zoom-in" class="p-2 rounded text-slate-500 hover:bg-slate-100 flex justify-center items-center" title="放大"><i class="fas fa-search-plus"></i></button>
                        <button id="btn-tool-zoom-out" class="p-2 rounded text-slate-500 hover:bg-slate-100 flex justify-center items-center" title="縮小"><i class="fas fa-search-minus"></i></button>
                    </div>
                </div>

                <!-- 智慧去背與修補 -->
                <div>
                    <h3 class="text-xs font-bold text-slate-600 mb-2 px-1">智慧去背與修補</h3>
                    <div class="sketch-panel p-4 space-y-4 bg-slate-50/50">
                        <button id="btn-tool-rmbg" class="w-full sketch-btn py-2.5 px-4 flex items-center gap-3 text-sm font-bold bg-white text-slate-700">
                            <i class="fas fa-magic w-5 text-center text-indigo-500"></i> 一鍵去背
                        </button>
                        <button id="btn-tool-brush-inpaint" class="w-full sketch-btn py-2.5 px-4 flex items-center gap-3 text-sm font-bold bg-white text-slate-700">
                            <i class="fas fa-eraser w-5 text-center text-indigo-500"></i> 塗抹修補 (畫筆)
                        </button>
                        <div id="inpaint-brush-settings" class="hidden px-2 pb-2">
                            <label class="text-xs text-slate-500 flex justify-between mb-1">
                                <span>畫筆粗細</span>
                                <span id="inpaint-brush-size-val">30px</span>
                            </label>
                            <input type="range" id="inpaint-brush-size" min="5" max="150" value="30" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>
                        <button id="btn-tool-area-rmbg" class="w-full sketch-btn py-2.5 px-4 flex items-center gap-3 text-sm font-bold bg-white text-slate-700">
                            <i class="fas fa-cut w-5 text-center text-indigo-500"></i> 選框去背
                        </button>
                        <button id="btn-tool-inpaint" class="w-full sketch-btn py-2.5 px-4 flex items-center gap-3 text-sm font-bold bg-white text-slate-700">
                            <i class="fas fa-band-aid w-5 text-center text-indigo-500"></i> 智慧修補
                        </button>
                        <button id="btn-tool-ocr" class="w-full sketch-btn py-2.5 px-4 flex items-center gap-3 text-sm font-bold bg-white text-slate-700">
                            <i class="fas fa-font w-5 text-center text-indigo-500"></i> 智慧辨識 (OCR)
                        </button>
                        <button id="btn-tool-solid-fill" class="w-full sketch-btn py-2.5 px-4 flex items-center gap-3 text-sm font-bold bg-white text-slate-700">
                            <i class="fas fa-square w-5 text-center text-indigo-500"></i> 純色覆蓋
                        </button>
                        <div id="solid-fill-settings" class="hidden pl-8 pr-4 space-y-3 pt-2">
                            <div>
                                <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
                                    <label>覆蓋範圍粗細</label>
                                    <span id="solid-fill-brush-size-val">30px</span>
                                </div>
                                <input type="range" id="solid-fill-brush-size" min="1" max="200" value="30" class="w-full accent-indigo-500">
                            </div>
                            <button id="btn-solid-fill-repick" class="w-full text-xs py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-lg transition border-2 border-transparent hover:border-slate-300">
                                <i class="fas fa-eye-dropper"></i> 重新吸取顏色
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 加入新物件 -->
                <div>
                    <h3 class="text-xs font-bold text-slate-600 mb-2 px-1">加入新物件</h3>
                    <div class="space-y-3">
                        <button id="btn-tool-text" class="w-full sketch-btn py-2.5 text-sm font-bold flex justify-start items-center px-4 gap-3 bg-orange-50 text-slate-700">
                            <i class="fas fa-text-width w-5 text-center"></i> 新增文字
                        </button>
                        <button id="btn-tool-table" class="w-full sketch-btn py-2.5 text-sm font-bold flex justify-start items-center px-4 gap-3 bg-white text-slate-700">
                            <i class="fas fa-table w-5 text-center text-indigo-500"></i> 建立表格
                        </button>
                        <button id="btn-tool-qrcode" class="w-full sketch-btn py-2.5 text-sm font-bold flex justify-start items-center px-4 gap-3 bg-white text-slate-700">
                            <i class="fas fa-qrcode w-5 text-center text-indigo-500"></i> QR 條碼
                        </button>
                        <button id="btn-tool-ext-img" class="w-full sketch-btn py-2.5 text-sm font-bold flex justify-start items-center px-4 gap-3 bg-white text-slate-700">
                            <i class="fas fa-image w-5 text-center text-indigo-500"></i> 外部圖片/Logo
                        </button>
                        <input type="file" id="input-tool-ext-img" accept="image/*" class="hidden">
                    </div>
                </div>
            </div>

            <!-- Properties Content -->
            <div id="panel-properties" style="display:none;" class="sidebar-panel flex-1 overflow-y-auto p-4 space-y-4">
                <div class="text-sm text-slate-500 text-center py-10" id="prop-empty-state">請選擇畫布上的物件以編輯屬性</div>
                <div id="prop-editor-container" style="display:none;" class="space-y-4">
                    <!-- Javascript 動態生成屬性表單 -->
                </div>
            </div>

            <!-- Assets Content -->
            <div id="panel-assets" style="display:none;" class="sidebar-panel flex-1 overflow-y-auto p-4 space-y-4 text-center">
                <div class="text-sm text-slate-500 py-10 font-bold">即將於 Sprint 3 實作</div>
            </div>

            <!-- Layers Content -->
            <div id="panel-layers" style="display:none;" class="sidebar-panel flex-1 overflow-y-auto p-4 flex flex-col gap-2">
                <!-- Javascript 動態生成圖層清單 -->
            </div>
            </div>
        </aside>

        <!-- Center Canvas Area -->
        <main id="workspace-container" class="flex-1 canvas-bg relative overflow-hidden">
            <!-- Canvas -->
            <canvas id="main-canvas"></canvas>
            
            <!-- Bottom Right Toolbar -->
            <div class="absolute bottom-6 right-6 flex flex-col gap-3 z-20">
                <button id="btn-tool-fullscreen" class="sketch-btn w-10 h-10 flex justify-center items-center bg-white text-slate-600 hover:text-indigo-600 transition-colors shadow-md rounded-lg relative" title="全螢幕模式">
                    <i class="fas fa-expand"></i>
                </button>
                
                <div class="relative">
                    <button id="btn-tool-layers" class="sketch-btn w-10 h-10 flex justify-center items-center bg-white text-slate-600 hover:text-indigo-600 transition-colors shadow-md rounded-lg" title="圖層快速預覽">
                        <i class="fas fa-layer-group"></i>
                    </button>
                    <!-- Quick Layers Popover -->
                    <div id="popover-quick-layers" class="hidden absolute bottom-0 right-14 w-64 bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden transform transition-all">
                        <div class="px-4 py-3 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                            <h4 class="font-bold text-sm text-slate-700">圖層快速預覽</h4>
                            <button id="btn-close-quick-layers" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
                        </div>
                        <div id="quick-layers-list" class="max-h-64 overflow-y-auto p-2 space-y-1 bg-slate-50/50">
                            <!-- JS 填入 -->
                        </div>
                    </div>
                </div>

                <div class="relative">
                    <button id="btn-tool-comments" class="sketch-btn w-10 h-10 flex justify-center items-center bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors shadow-md rounded-lg" title="留言評論">
                        <i class="fas fa-comment-dots"></i>
                    </button>
                    <!-- Comments Panel Popover -->
                    <div id="popover-comments" class="hidden absolute bottom-0 right-14 w-80 bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
                        <div class="px-4 py-3 border-b border-slate-100 bg-indigo-50 flex justify-between items-center">
                            <h4 class="font-bold text-sm text-indigo-800"><i class="fas fa-comments mr-2"></i>留言評論</h4>
                            <button id="btn-close-comments" class="text-indigo-400 hover:text-indigo-600"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="flex-1 max-h-80 overflow-y-auto p-4 space-y-4 bg-slate-50/30">
                            <!-- Mock Comment 1 -->
                            <div class="flex gap-3">
                                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold shrink-0">A</div>
                                <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm text-xs text-slate-600">
                                    <p class="font-bold text-slate-700 mb-1">Alice <span class="font-normal text-slate-400 text-[10px] ml-2">昨天</span></p>
                                    這裡的標題字體可以再大一點嗎？目前在手機版上可能不夠明顯。
                                </div>
                            </div>
                            <!-- Mock Comment 2 -->
                            <div class="flex gap-3">
                                <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-600 font-bold shrink-0">B</div>
                                <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm text-xs text-slate-600">
                                    <p class="font-bold text-slate-700 mb-1">Bob <span class="font-normal text-slate-400 text-[10px] ml-2">2小時前</span></p>
                                    同意 Alice，另外顏色建議換成品牌主色調 #4F46E5。
                                </div>
                            </div>
                        </div>
                        <div class="p-3 border-t border-slate-100 bg-white flex gap-2">
                            <input type="text" placeholder="新增留言..." class="flex-1 border border-slate-300 rounded-md px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                            <button class="bg-indigo-600 text-white rounded-md px-3 py-1.5 text-xs hover:bg-indigo-700"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar (Thumbnails) -->
        <aside id="thumbnails-container" class="sidebar-collapsible relative w-48 sm:w-56 lg:w-64 bg-white border-l-2 border-slate-700 flex flex-col z-20 shrink-0 select-none">
            <!-- Right Sidebar Floating Toggle Button -->
            <button id="btn-toggle-right-sidebar" class="absolute -left-3.5 top-1/2 -translate-y-1/2 z-40 w-7 h-9 bg-white border-2 border-slate-700 rounded-l-md shadow-[-2px_2px_0px_#334155] flex items-center justify-center text-slate-700 hover:bg-slate-100 hover:text-indigo-600 transition cursor-pointer" title="收合/展開頁面清單">
                <i id="icon-toggle-right-sidebar" class="fas fa-chevron-right text-[11px] pointer-events-none transition-transform duration-200"></i>
            </button>
            <div id="right-sidebar-inner" class="flex flex-col flex-1 w-full h-full min-w-[190px] overflow-hidden">
                <!-- Header -->
                <div class="p-4 border-b-2 border-slate-700 flex justify-between items-center shrink-0">
                    <h3 id="thumbnails-count" class="text-sm font-bold text-slate-800 whitespace-nowrap">頁面清單 (1)</h3>
                    <button id="btn-add-page" class="sketch-btn w-6 h-6 flex justify-center items-center bg-indigo-50 text-indigo-700 p-0 text-xs" title="新增頁面">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                
                <!-- List -->
                <div id="thumbnails-list" class="flex-1 overflow-y-auto p-4 bg-slate-50/30">
                    <!-- Javascript 會動態生成內容於此 -->
                </div>
            </div>
        </aside>

    </div>
    
    <!-- QR Code 輸入對話框 (預設隱藏) -->
    <div id="modal-qrcode" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl w-96 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800"><i class="fas fa-qrcode mr-2 text-indigo-600"></i>產生 QR 條碼</h3>
                <button id="btn-qr-close" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6">
                <label class="block text-sm font-bold text-slate-600 mb-2">請輸入網址或文字</label>
                <input type="text" id="input-qr-url" placeholder="https://..." class="w-full sketch px-3 py-2 text-slate-700 outline-none focus:border-indigo-500 mb-4" />
                <p class="text-xs text-slate-500 mb-6">系統將會為您生成可自由縮放與變更顏色的向量 QR Code。</p>
                
                <div class="flex justify-end gap-3">
                    <button id="btn-qr-cancel" class="sketch-btn px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50">取消</button>
                    <button id="btn-qr-confirm" class="sketch-btn px-4 py-2 text-sm font-bold text-white bg-indigo-600 border-indigo-700 hover:bg-indigo-700">確認產生</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 匯出多頁警告對話框 (預設隱藏) -->
    <div id="modal-export-warning" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl w-96 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800"><i class="fas fa-exclamation-triangle mr-2 text-amber-500"></i>匯出提醒</h3>
                <button id="btn-export-warn-close" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6">
                <p class="text-sm font-bold text-slate-700 mb-6">僅會匯出當前頁面，是否確定執行？</p>
                
                <div class="flex items-center gap-2 mb-6">
                    <input type="checkbox" id="checkbox-export-no-warn" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
                    <label for="checkbox-export-no-warn" class="text-sm text-slate-600 cursor-pointer">不再提醒</label>
                </div>
                
                <div class="flex justify-end gap-3">
                    <button id="btn-export-warn-cancel" class="sketch-btn px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50">取消</button>
                    <button id="btn-export-warn-confirm" class="sketch-btn px-4 py-2 text-sm font-bold text-white bg-indigo-600 border-indigo-700 hover:bg-indigo-700">確認執行</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AI 智慧文案潤飾彈窗 -->
    <div id="ai-text-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 hidden">
        <div class="bg-amber-50/40 backdrop-blur-md rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col mx-4 border border-white/50 relative">
            <!-- Header -->
            <div class="px-6 py-5 flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-fuchsia-500 to-purple-600 flex justify-center items-center text-white text-lg shadow-inner">
                    <i class="fas fa-magic"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800 flex items-center">
                    AI 智慧文案潤飾 
                    <span class="ml-3 text-xs px-2 py-1 bg-slate-200 text-slate-600 rounded-md font-normal border border-slate-300 shadow-inner">模型: nemotron-omni</span>
                </h2>
            </div>
            
            <!-- Content -->
            <div class="px-6 pb-6 flex-1 overflow-y-auto space-y-6">
                <!-- Original Text -->
                <div class="bg-slate-100/80 rounded-xl p-4 border border-white relative">
                    <div class="absolute w-2 h-full bg-slate-300 left-0 top-0 rounded-l-xl"></div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 pl-2">原始文字</label>
                    <div id="ai-modal-original-text" class="text-slate-700 text-sm pl-2 whitespace-pre-wrap max-h-32 overflow-y-auto">
                        <!-- JS 填入 -->
                    </div>
                </div>

                <!-- AI Magic Result -->
                <div class="bg-purple-50/30 rounded-xl p-4 border border-purple-200 shadow-sm">
                    <label class="block text-xs font-bold text-purple-600 mb-2">✨ AI 智慧魔術</label>
                    <textarea id="ai-modal-final-text" class="w-full bg-transparent text-slate-800 text-sm whitespace-pre-wrap max-h-48 overflow-y-auto resize-none focus:outline-none focus:ring-0 border-none p-0 m-0"></textarea>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-6 py-4 bg-white/50 border-t border-slate-200 flex justify-end gap-3">
                <button id="btn-ai-modal-cancel" class="px-6 py-2 border-2 border-slate-800 text-slate-800 font-bold rounded-lg hover:bg-slate-100 transition">取消</button>
                <button id="btn-ai-modal-confirm" class="px-6 py-2 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-700 transition shadow-md flex items-center gap-2">
                    <i class="fas fa-check"></i> 確認套用
                </button>
            </div>
        </div>
    </div>

    <!-- 主程式進入點 -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
